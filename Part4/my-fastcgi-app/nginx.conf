events{}
http{
    server{
        listen 81;
        server_name localhost;

        # Проксирование на наш C-сервер
        location /{
            fastcgi_pass 127.0.0.1:8080;
            include fastcgi_params;
        }

        # Настройка страницы статуса Nginx
        location /status {
            stub_status on;
            access_log off;
            allow all; # Разрешаем доступ (это нам пойдет, т.к. при обращении через пробросы портов Docker подменяет IP клиента на свой внутренний.)
        }
    }
}