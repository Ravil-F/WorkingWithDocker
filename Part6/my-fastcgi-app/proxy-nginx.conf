events{}

http{
    server{
        listen 8080;
        server_name localhost;

        location /{
            ## "app" — это имя сервиса из docker-compose.yml
            proxy_pass http://app:81;

            # Передаем заголовки, чтобы Nginx знал реальный IP клиента
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}